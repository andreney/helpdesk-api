name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Estilo de código (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verificar estilo
        run: vendor/bin/pint --test

  tests:
    name: Testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar a aplicação
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Executar testes
        run: php artisan test --compact
